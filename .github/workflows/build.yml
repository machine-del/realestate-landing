name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sanity-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Strip non-linux @typescript native packages from studio lockfile
        run: |
          cd sanity-studio
          node -e '
            const fs = require("fs");
            const path = "package-lock.json";
            const lock = JSON.parse(fs.readFileSync(path, "utf8"));
            const pkgs = lock.packages || {};
            const removed = [];
            for (const key of Object.keys(pkgs)) {
              if (key.includes("@typescript/typescript-") && !key.includes("linux-x64")) {
                delete pkgs[key];
                removed.push(key);
              }
            }
            fs.writeFileSync(path, JSON.stringify(lock, null, 2));
            console.log("Removed from lockfile:");
            removed.forEach(r => console.log("  " + r));
          '
          cd ..

      - name: Install Sanity Studio dependencies
        run: npm ci --prefix sanity-studio --omit=optional

      - name: Build site
        run: npm run build
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}

      - name: Build Sanity Studio
        run: npm run studio:build